name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sast:
    name: SAST (gosec)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go modules
        run: go mod download

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.2

      - name: Run gosec
        id: gosec
        continue-on-error: true
        run: |
          set +e
          "$(go env GOPATH)/bin/gosec" \
            -fmt sarif \
            -out gosec.sarif \
            -severity medium \
            -confidence medium \
            ./...
          scan_exit_code=$?
          echo "scan_exit_code=$scan_exit_code" >> "$GITHUB_OUTPUT"

      - name: Upload gosec SARIF
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Enforce fail policy (SAST)
        if: steps.gosec.outputs.scan_exit_code != '0'
        run: |
          echo "SAST findings met fail threshold (severity>=medium, confidence>=medium)."
          exit 1

  dependency-scan:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Download Go modules
        run: go mod download

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run govulncheck
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Run npm audit (runtime deps, high+)
        working-directory: ui
        run: npm audit --omit=dev --audit-level=high

  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: rbitr-gateway:security-scan

      - name: Run Trivy fail gate (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rbitr-gateway:security-scan
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Run Trivy SARIF export
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rbitr-gateway:security-scan
          format: sarif
          output: trivy-gateway.sarif
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-gateway.sarif
          category: trivy-gateway

  sbom-and-sign:
    name: SBOM + Signing
    runs-on: ubuntu-latest
    needs: [sast, dependency-scan, container-scan]
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for PR SBOM
        if: github.event_name != 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: rbitr-gateway:sbom

      - name: Build and push image
        if: github.event_name == 'push'
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rbitr-gateway:${{ github.sha }}
          provenance: false

      - name: Generate image SBOM (push)
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/rbitr-gateway:${{ github.sha }}
          format: spdx-json
          output-file: sbom-gateway.spdx.json

      - name: Generate image SBOM (PR)
        if: github.event_name != 'push'
        uses: anchore/sbom-action@v0
        with:
          image: rbitr-gateway:sbom
          format: spdx-json
          output-file: sbom-gateway.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-gateway-spdx
          path: sbom-gateway.spdx.json
          if-no-files-found: error

      - name: Install cosign
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1

      - name: Keyless sign image
        if: github.event_name == 'push'
        run: |
          image_ref="ghcr.io/${{ github.repository_owner }}/rbitr-gateway@${{ steps.build_push.outputs.digest }}"
          cosign sign --yes "$image_ref"

      - name: Keyless attest SBOM
        if: github.event_name == 'push'
        run: |
          image_ref="ghcr.io/${{ github.repository_owner }}/rbitr-gateway@${{ steps.build_push.outputs.digest }}"
          cosign attest --yes --type spdxjson --predicate sbom-gateway.spdx.json "$image_ref"

      - name: GitHub provenance attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/rbitr-gateway
          subject-digest: ${{ steps.build_push.outputs.digest }}
          push-to-registry: true
