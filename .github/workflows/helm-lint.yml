name: Helm Lint

on:
  pull_request:
    paths:
      - "deploy/helm/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.0

      - name: Add Bitnami repo
        run: helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Update dependencies
        run: helm dependency update deploy/helm/rbitr

      - name: Helm lint
        run: helm lint deploy/helm/rbitr

      - name: Helm template (default values)
        run: helm template rbitr deploy/helm/rbitr > /dev/null

      - name: Helm template (production values)
        run: helm template rbitr deploy/helm/rbitr -f deploy/helm/rbitr/values-production.yaml > /dev/null

      - name: Helm template (bundled PostgreSQL)
        run: helm template rbitr deploy/helm/rbitr --set postgresql.enabled=true > /dev/null

      - name: Helm template (AWS Marketplace)
        run: helm template rbitr deploy/helm/rbitr -f deploy/helm/rbitr/values-aws-marketplace.yaml > /dev/null

      - name: Helm template (GCP Marketplace)
        run: helm template rbitr deploy/helm/rbitr -f deploy/helm/rbitr/values-gcp-marketplace.yaml > /dev/null

      - name: Helm template (Azure Marketplace)
        run: helm template rbitr deploy/helm/rbitr -f deploy/helm/rbitr/values-azure-marketplace.yaml > /dev/null
