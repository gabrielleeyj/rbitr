name: Marketplace Onboarding Verification

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Show Docker Versions
        run: |
          docker version
          docker compose version

      - name: Run Marketplace Onboarding Harness
        env:
          COMPOSE_PROJECT_NAME: rbitr-marketplace-${{ github.run_id }}
          REPORT_FILE: artifacts/marketplace_onboarding_report.json
          SETUP_TOKEN: setup_marketplace_token_2026
        run: ./scripts/verify_marketplace_onboarding.sh

      - name: Upload Marketplace Onboarding Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-onboarding-report
          path: artifacts/marketplace_onboarding_report.json
          if-no-files-found: error
