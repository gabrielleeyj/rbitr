apiVersion: v1
kind: Service
metadata:
  name: {{ include "rbitr.fullname" . }}-gateway
  labels:
    {{- include "rbitr.gateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "rbitr.gateway.selectorLabels" . | nindent 4 }}
