{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "rbitr.fullname" . }}-ui
  labels:
    {{- include "rbitr.ui.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5173
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "rbitr.ui.selectorLabels" . | nindent 4 }}
{{- end }}
