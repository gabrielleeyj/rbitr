apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rbitr.fullname" . }}-gateway
  labels:
    {{- include "rbitr.gateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "rbitr.gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "rbitr.gateway.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rbitr.serviceAccountName" . }}
      containers:
        - name: gateway
          image: {{ include "rbitr.gateway.image" . }}
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "rbitr.secretName" . }}
                  key: {{ include "rbitr.secretDatabaseKey" . }}
            - name: RBTR_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "rbitr.secretName" . }}
                  key: RBTR_SETUP_TOKEN
            - name: RBTR_TENANT_KEY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rbitr.secretName" . }}
                  key: RBTR_TENANT_KEY_HMAC_SECRET
            - name: RBTR_ADMIN_KEY_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "rbitr.secretName" . }}
                  key: RBTR_ADMIN_KEY_HMAC_SECRET
          envFrom:
            - configMapRef:
                name: {{ include "rbitr.fullname" . }}-config
          {{- with .Values.gateway.env }}
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: license-data
              mountPath: {{ dir .Values.license.keyPath }}
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        {{- if .Values.license.existingSecret }}
        - name: license-data
          secret:
            secretName: {{ .Values.license.existingSecret }}
            items:
              - key: license.key
                path: {{ base .Values.license.keyPath }}
            optional: true
        {{- else }}
        - name: license-data
          emptyDir: {}
        {{- end }}
      {{- with .Values.gateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.gateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
