  00014_audit_hash_chain.sql: |
    -- +goose Up
    ALTER TABLE rbitr.admin_audit_events ADD COLUMN IF NOT EXISTS stream_id TEXT;
    ALTER TABLE rbitr.admin_audit_events ADD COLUMN IF NOT EXISTS event_hash TEXT;
    ALTER TABLE rbitr.admin_audit_events ADD COLUMN IF NOT EXISTS prev_hash TEXT;

    UPDATE rbitr.admin_audit_events
    SET stream_id = COALESCE(tenant_id, 'global')
    WHERE stream_id IS NULL;

    ALTER TABLE rbitr.admin_audit_events ALTER COLUMN stream_id SET NOT NULL;

    CREATE INDEX IF NOT EXISTS idx_admin_audit_events_stream_time
    ON rbitr.admin_audit_events (stream_id, created_at DESC);

    -- +goose StatementBegin
    CREATE OR REPLACE FUNCTION rbitr.block_audit_mutations()
    RETURNS trigger AS $fn$
    BEGIN
      RAISE EXCEPTION 'audit events are immutable';
    END;
    $fn$ LANGUAGE plpgsql;
    -- +goose StatementEnd

    DROP TRIGGER IF EXISTS audit_events_immutable ON rbitr.admin_audit_events;
    CREATE TRIGGER audit_events_immutable
    BEFORE UPDATE OR DELETE ON rbitr.admin_audit_events
    FOR EACH ROW EXECUTE FUNCTION rbitr.block_audit_mutations();

    INSERT INTO rbitr.system_settings (key, value, updated_at)
    VALUES ('audit_retention_days', '365', NOW())
    ON CONFLICT (key) DO NOTHING;

    -- +goose Down
    DROP TRIGGER IF EXISTS audit_events_immutable ON rbitr.admin_audit_events;
    DROP FUNCTION IF EXISTS rbitr.block_audit_mutations;
    DROP INDEX IF EXISTS idx_admin_audit_events_stream_time;
    ALTER TABLE rbitr.admin_audit_events DROP COLUMN IF EXISTS prev_hash;
    ALTER TABLE rbitr.admin_audit_events DROP COLUMN IF EXISTS event_hash;
    ALTER TABLE rbitr.admin_audit_events DROP COLUMN IF EXISTS stream_id;
    DELETE FROM rbitr.system_settings WHERE key = 'audit_retention_days';

  00015_fix_demo_policy_syntax.sql: |
    -- +goose Up
    -- Fix the demo policy to:
    -- 1. Add import rego.v1 statement (required by OPA)
    -- 2. Remove illegal default rule with function call
    -- 3. Use proper else chaining to avoid rule conflicts
    -- 4. Add missing tags field for schema compliance

    UPDATE rbitr.policies
    SET rego_module = $$
    package rbitr.policy

    import rego.v1

    decision_obj(decision, risk, rule_id, priority, code, message) := {
        "version": "2026-01-20",
        "decision": decision,
        "risk": risk,
        "rule": {"id": rule_id, "priority": priority},
        "reasons": [{"code": code, "message": message}],
        "constraints": {},
        "tags": []
    }

    allow_actions := {
        "TICKET.CREATE",
        "TICKET.COMMENT",
        "TICKET.UPDATE",
        "CRM.READ",
        "DATA.READ",
        "DATA.QUERY"
    }

    require_approval_actions := {
        "PAYMENT.REFUND",
        "ACCESS.ROLE_CHANGE"
    }

    deny_actions := {
        "DATA.EXPORT",
        "DATA.BULK_EXPORT",
        "ACCESS.GRANT",
        "DATA.DELETE",
        "CRM.DELETE"
    }

    decision := decision_obj("DENY", input.action_risk, "rule_deny_sensitive_v1", 100, "DENY_SENSITIVE", "Policy: deny sensitive action") if {
        deny_actions[input.action_type]
    } else := decision_obj("REQUIRE_APPROVAL", input.action_risk, "rule_require_approval_v1", 50, "APPROVAL_REQUIRED", "Policy: approval required") if {
        require_approval_actions[input.action_type]
    } else := decision_obj("ALLOW", input.action_risk, "rule_allow_basic_actions_v1", 10, "ALLOW_BASIC", "Policy: allow basic actions") if {
        allow_actions[input.action_type]
    } else := decision_obj("REQUIRE_APPROVAL", input.action_risk, "rule_high_risk_unknown", 80, "HIGH_RISK_UNKNOWN", "Policy: approval required for high/critical risk") if {
        input.action_risk == "HIGH"
    } else := decision_obj("REQUIRE_APPROVAL", input.action_risk, "rule_critical_risk_unknown", 80, "CRITICAL_RISK_UNKNOWN", "Policy: approval required for high/critical risk") if {
        input.action_risk == "CRITICAL"
    } else := decision_obj("DENY", input.action_risk, "rule_default_deny", 100, "DEFAULT_DENY", "Default deny: no matching rule")
    $$
    WHERE tenant_id = 't_demo' AND policy_id = 'policy_demo';

    UPDATE rbitr.policy_versions
    SET rego_module = $$
    package rbitr.policy

    import rego.v1

    decision_obj(decision, risk, rule_id, priority, code, message) := {
        "version": "2026-01-20",
