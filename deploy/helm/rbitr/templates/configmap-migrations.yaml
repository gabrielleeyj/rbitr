        "risk": risk,
        "rule": {"id": rule_id, "priority": priority},
        "reasons": [{"code": code, "message": message}],
        "constraints": {},
        "tags": []
    }

    allow_actions := {
        "TICKET.CREATE",
        "TICKET.COMMENT",
        "TICKET.UPDATE",
        "CRM.READ",
        "DATA.READ",
        "DATA.QUERY"
    }

