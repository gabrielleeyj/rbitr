    }

    default decision := decision_obj("DENY", input.action_risk, "rule_default_deny", 100, "DEFAULT_DENY", "Default deny")

    allow_actions := {
        "TICKET.CREATE",
        "TICKET.COMMENT",
        "TICKET.UPDATE",
        "CRM.READ",
        "DATA.READ",
        "DATA.QUERY"
    }

    require_approval_actions := {
        "PAYMENT.REFUND",
