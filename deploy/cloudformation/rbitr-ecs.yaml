AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  rbitr — AI Agent Governance Gateway on ECS Fargate with RDS PostgreSQL and ALB.
  Quick-start template for AWS Marketplace deployment.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Network }
        Parameters: [VpcCIDR, PublicSubnet1CIDR, PublicSubnet2CIDR, PrivateSubnet1CIDR, PrivateSubnet2CIDR]
      - Label: { default: TLS }
        Parameters: [CertificateArn]
      - Label: { default: Database }
        Parameters: [DBInstanceClass, DBAllocatedStorage]
      - Label: { default: Container Images }
        Parameters: [GatewayImageUri, UIImageUri]
      - Label: { default: Application }
        Parameters: [SetupToken, GatewayCpu, GatewayMemory, UICpu, UIMemory]

Parameters:
  VpcCIDR:
    Type: String
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC

  PublicSubnet1CIDR:
    Type: String
    Default: 10.0.1.0/24

  PublicSubnet2CIDR:
    Type: String
    Default: 10.0.2.0/24

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.0.10.0/24

  PrivateSubnet2CIDR:
    Type: String
    Default: 10.0.11.0/24

  CertificateArn:
    Type: String
    Description: ACM certificate ARN for HTTPS listener
    AllowedPattern: "arn:aws:acm:.*"

  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium, db.t4g.large]

  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000

  GatewayImageUri:
    Type: String
    Description: Gateway container image URI (e.g. ghcr.io/gabrielleeyj/rbitr/gateway:v0.1.0)

  UIImageUri:
    Type: String
    Description: UI container image URI (e.g. ghcr.io/gabrielleeyj/rbitr/ui:v0.1.0)

  SetupToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Bootstrap setup token (auto-generated if empty)

  GatewayCpu:
    Type: Number
    Default: 256
    AllowedValues: [256, 512, 1024, 2048]

  GatewayMemory:
    Type: Number
    Default: 512
    AllowedValues: [512, 1024, 2048, 4096]

  UICpu:
    Type: Number
    Default: 256
    AllowedValues: [256, 512]

  UIMemory:
    Type: Number
    Default: 512
    AllowedValues: [512, 1024]

Conditions:
  GenerateSetupToken: !Equals [!Ref SetupToken, ""]

Resources:
  ## ── VPC ─────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: rbitr-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: rbitr-public-1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: rbitr-public-2

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: rbitr-private-1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: rbitr-private-2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  NatEIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet1

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  ## ── Security Groups ─────────────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
        - IpProtocol: tcp
          FromPort: 5173
          ToPort: 5173
          SourceSecurityGroupId: !Ref ALBSecurityGroup

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup

  ## ── RDS PostgreSQL ──────────────────────────────────────────────
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: rbitr database subnets
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  DBCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/db-credentials"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "rbitr"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16"
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: rbitr
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: true

  ## ── Secrets Manager (Application) ───────────────────────────────
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/app-secrets"
      SecretString: !Sub
        - |
          {
            "DATABASE_URL": "postgres://${DBUser}:${DBPass}@${DBHost}:5432/rbitr?sslmode=require",
            "RBTR_SETUP_TOKEN": "${Token}",
            "RBTR_TENANT_KEY_HMAC_SECRET": "${TenantHmac}",
            "RBTR_ADMIN_KEY_HMAC_SECRET": "${AdminHmac}"
          }
        - DBUser: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}:SecretString:username}}"
          DBPass: !Sub "{{resolve:secretsmanager:${DBCredentialsSecret}:SecretString:password}}"
          DBHost: !GetAtt Database.Endpoint.Address
          Token: !If [GenerateSetupToken, !Sub "{{resolve:secretsmanager:${SetupTokenSecret}:SecretString:token}}", !Ref SetupToken]
          TenantHmac: !Sub "{{resolve:secretsmanager:${TenantHmacSecret}}}"
          AdminHmac: !Sub "{{resolve:secretsmanager:${AdminHmacSecret}}}"

  SetupTokenSecret:
    Type: AWS::SecretsManager::Secret
    Condition: GenerateSetupToken
    Properties:
      Name: !Sub "${AWS::StackName}/setup-token"
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: token
        PasswordLength: 32
        ExcludePunctuation: true

  TenantHmacSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/tenant-hmac-key"
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  AdminHmacSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/admin-hmac-key"
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  ## ── ECS Cluster ─────────────────────────────────────────────────
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  ## ── CloudWatch Log Groups ───────────────────────────────────────
  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/gateway"
      RetentionInDays: 30

  UILogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/ui"
      RetentionInDays: 14

  MigrateLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}/migrate"
      RetentionInDays: 14

  ## ── IAM ─────────────────────────────────────────────────────────
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref AppSecret
                  - !Ref DBCredentialsSecret

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole

  ## ── ALB ─────────────────────────────────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AWS::StackName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
      SecurityGroups:
        - !Ref ALBSecurityGroup

  GatewayTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  UITargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VPC
      Protocol: HTTP
      Port: 5173
      TargetType: ip
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultAction:
        Type: forward
        TargetGroupArn: !Ref UITargetGroup

  GatewayAPIRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 10
      Conditions:
        - Field: path-pattern
          PathPatternConfig:
            Values: ["/v1/*", "/admin/*", "/setup/*", "/healthz", "/readyz", "/metrics"]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref GatewayTargetGroup

  ## ── ECS Task Definitions ────────────────────────────────────────
  GatewayTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-gateway"
      Cpu: !Ref GatewayCpu
      Memory: !Ref GatewayMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: gateway
          Image: !Ref GatewayImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Sub "${AppSecret}:DATABASE_URL::"
            - Name: RBTR_SETUP_TOKEN
              ValueFrom: !Sub "${AppSecret}:RBTR_SETUP_TOKEN::"
            - Name: RBTR_TENANT_KEY_HMAC_SECRET
              ValueFrom: !Sub "${AppSecret}:RBTR_TENANT_KEY_HMAC_SECRET::"
            - Name: RBTR_ADMIN_KEY_HMAC_SECRET
              ValueFrom: !Sub "${AppSecret}:RBTR_ADMIN_KEY_HMAC_SECRET::"
          Environment:
            - Name: RBTR_SETUP_TOKEN_REQUIRED
              Value: "true"
            - Name: RBTR_LICENSE_KEY_PATH
              Value: "/tmp/rbitr/license.key"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GatewayLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: gateway
          HealthCheck:
            Command: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 10

  UITaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-ui"
      Cpu: !Ref UICpu
      Memory: !Ref UIMemory
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: ui
          Image: !Ref UIImageUri
          Essential: true
          PortMappings:
            - ContainerPort: 5173
              Protocol: tcp
          Environment:
            - Name: RBTR_API_UPSTREAM
              Value: !Sub "http://${ALB.DNSName}"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref UILogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ui

  ## ── ECS Services ────────────────────────────────────────────────
  GatewayService:
    Type: AWS::ECS::Service
    DependsOn: GatewayAPIRule
    Properties:
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref GatewayTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: gateway
          ContainerPort: 8080
          TargetGroupArn: !Ref GatewayTargetGroup

  UIService:
    Type: AWS::ECS::Service
    DependsOn: HTTPSListener
    Properties:
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref UITaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - !Ref PrivateSubnet1
            - !Ref PrivateSubnet2
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: ui
          ContainerPort: 5173
          TargetGroupArn: !Ref UITargetGroup

Outputs:
  ALBDNSName:
    Description: ALB DNS name
    Value: !GetAtt ALB.DNSName

  DatabaseEndpoint:
    Description: RDS endpoint
    Value: !GetAtt Database.Endpoint.Address

  AppSecretArn:
    Description: Secrets Manager ARN for application secrets
    Value: !Ref AppSecret

  SetupTokenSecretArn:
    Condition: GenerateSetupToken
    Description: Secrets Manager ARN for the auto-generated setup token
    Value: !Ref SetupTokenSecret

  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref ECSCluster
